name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11        # match your pom's Java version
          cache: maven
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=neerajgarg3
          -Dsonar.projectKey=neerajgarg3_demo
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

  publish:
    name: Publish image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Build jar
        run: mvn -B package -DskipTests
      - name: Build and push image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_SHA: ${{ github.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GH_OWNER,,}/demo"
          docker build -t "$IMAGE:$GH_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GH_SHA"
          docker push "$IMAGE:latest"
